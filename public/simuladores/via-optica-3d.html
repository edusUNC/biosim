<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vía Óptica 3D</title>
  <!--
    Vista 3D del simulador de vía óptica. Se abre embebida desde simulador-via-optica.html,
    que le envía por postMessage el estado calculado por su propio modelo (cortes y campo perdido)
    y la escena de la vaca. Esta página solo dibuja: no decide qué se pierde.
  -->
  <style>
    :root {
      --bg: #0f1420; --panel: rgba(22, 30, 46, .92); --text: #e6ebf5; --muted: #93a0b8;
      --lesion: #e11d48; --nasal: #2563eb; --temporal: #dc2626; --ok: #16a34a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    #scene { position: fixed; inset: 0; }
    #panel {
      position: fixed; top: 14px; left: 14px; width: 300px; max-width: calc(100vw - 28px);
      background: var(--panel); border-radius: 12px; padding: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
      backdrop-filter: blur(6px);
    }
    .kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
    #lesion-nombre { font-size: 15px; font-weight: 700; margin: 2px 0 2px; }
    #lesion-zona { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; line-height: 1.4; }
    #examen { font-size: 12.5px; line-height: 1.45; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: #22304a; }
    #examen[hidden] { display: none; }
    #examen .ok { color: #4ade80; } #examen .mal { color: #fb7185; }
    #btn-siguiente { margin-top: 8px; width: 100%; padding: 7px; border: 0; border-radius: 8px; background: #0b5fa5; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    figure { margin: 0; }
    figcaption { font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    #percepcion { width: 100%; border-radius: 8px; display: block; background: #1b2331; }
    .vistas { display: flex; gap: 6px; margin-top: 10px; }
    .vistas button {
      flex: 1; padding: 7px 6px; border: 0; border-radius: 8px; background: #2a3650; color: var(--text);
      font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    }
    .vistas button[aria-pressed="true"] { background: #0b5fa5; }
    #btn-reiniciar {
      margin-top: 6px; width: 100%; padding: 7px 6px; border: 1px solid #3a4a6d; border-radius: 8px;
      background: transparent; color: var(--text); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    }
    #btn-reiniciar:hover { background: #2a3650; }
    .legend { font-size: 11.5px; color: var(--muted); margin-top: 10px; line-height: 1.7; }
    .legend span { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
    .hint { font-size: 11.5px; color: var(--muted); margin-top: 8px; }
    .label3d {
      font: 700 12px system-ui; color: #fff; background: var(--lesion); border-radius: 50%;
      width: 22px; height: 22px; display: grid; place-items: center; pointer-events: auto; cursor: pointer;
      box-shadow: 0 0 0 2px rgba(255,255,255,.85);
    }
    .label3d.activo { transform: scale(1.3); }
    body.vista-paciente .label3d { display: none; }
    @media (max-width: 640px) {
      #panel { top: auto; bottom: 10px; left: 10px; width: calc(100vw - 20px); padding: 10px; }
      #percepcion { max-height: 90px; object-fit: contain; }
      .legend, .hint { display: none; }
    }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="scene"></div>
  <div id="panel">
    <div class="kicker" id="lesion-kicker">Defecto campimétrico</div>
    <div id="lesion-nombre">Visión normal</div>
    <p id="lesion-zona">Sin lesión: las cuatro vías conducen.</p>
    <div id="examen" hidden>
      <div id="examen-texto"></div>
      <button type="button" id="btn-siguiente" hidden>Siguiente caso</button>
    </div>
    <figure>
      <figcaption>Lo que ve el paciente (con los dos ojos)</figcaption>
      <canvas id="percepcion" width="808" height="452"></canvas>
    </figure>
    <div class="vistas" role="group" aria-label="Cámara">
      <button type="button" id="btn-general" aria-pressed="true">Vista general</button>
      <button type="button" id="btn-paciente" aria-pressed="false">Desde los ojos</button>
    </div>
    <button type="button" id="btn-reiniciar">↺ Reiniciar</button>
    <div class="legend">
      <span style="background:var(--nasal)"></span>Retina nasal (cruza) &nbsp;
      <span style="background:var(--temporal)"></span>Retina temporal<br>
      <span style="background:#3a4050"></span>Fibra sin señal &nbsp;
      <span style="background:#0b1016;outline:1px solid #445"></span>Campo perdido
    </div>
    <div class="hint" id="hint">Arrastrá para rotar · rueda para zoom · clic en un número para lesionar.</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // Convención: +x = izquierda del paciente, +y = arriba, +z = adelante (hacia donde miran los ojos).
    const LEFT = 1, RIGHT = -1;
    const OJO = { L: LEFT, R: RIGHT };
    const DEG = Math.PI / 180;
    // Mismo código de color que el diagrama 2D: se colorea por hemirretina.
    const COLOR = { N: new THREE.Color(0x2563eb), T: new THREE.Color(0xdc2626) };
    const COLOR_MUERTA = new THREE.Color(0x4a5163);

    // Geometría del campo binocular del simulador 2D (se reemplaza por la que envía la página madre).
    let B = { fx: 280, fy: 124, rx: 150, ry: 100, dx: 40 };
    const ESCENA = { x0: 78, y0: 16, w: 404, h: 226 };  // viewBox de la escena de la vaca
    const PX_POR_GRADO = 1.85;                         // ~100° temporal = 190 px en el esquema 2D

    // ---------- Escena ----------
    const container = document.getElementById('scene');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f1420);
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 100);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    container.appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(innerWidth, innerHeight);
    labelRenderer.domElement.style.cssText = 'position:absolute;top:0;pointer-events:none';
    container.appendChild(labelRenderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.2));
    const dir = new THREE.DirectionalLight(0xffffff, 1.5);
    dir.position.set(-3, 6, -4);
    scene.add(dir);

    // ---------- Anatomía (formas simplificadas) ----------
    const ghost = (color, opacity) => new THREE.MeshStandardMaterial({
      color, transparent: true, opacity, depthWrite: false, roughness: 0.8
    });

    const head = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), ghost(0xd9b38c, 0.08));
    head.scale.set(2.6, 3.0, 4.2);
    head.position.set(0, 0.3, -0.2);
    scene.add(head);

    const EYE_POS = eye => new THREE.Vector3(eye * 1.2, 0, 3.5);
    for (const side of [LEFT, RIGHT]) {
      const hemi = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), ghost(0xc9a0a8, 0.12));
      hemi.scale.set(1.15, 1.5, 3.3);
      hemi.position.set(side * 1.2, 0.5, -0.6);
      scene.add(hemi);

      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.55, 32, 24),
        new THREE.MeshStandardMaterial({ color: 0xf4f4f4, roughness: 0.3 }));
      eye.position.copy(EYE_POS(side));
      scene.add(eye);
      const iris = new THREE.Mesh(new THREE.CircleGeometry(0.22, 32),
        new THREE.MeshStandardMaterial({ color: 0x3b6e8f }));
      iris.position.copy(EYE_POS(side)).add(new THREE.Vector3(0, 0, 0.551));
      scene.add(iris);

      // Cuerpo geniculado lateral y corteza visual primaria
      const lgn = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 12), ghost(0xffd166, 0.7));
      lgn.position.set(side * 0.95, -0.25, -0.3);
      scene.add(lgn);
      const v1 = new THREE.Mesh(new THREE.SphereGeometry(0.45, 24, 16), ghost(0xffd166, 0.25));
      v1.scale.set(0.6, 1, 0.5);
      v1.position.set(side * 0.35, 0, -3.35);
      scene.add(v1);
    }

    // ---------- Fibras ----------
    // Cada fibra: ojo × hemirretina (T/N) × mitad (sup/inf), con 3 hebras para dar volumen.
    const fibers = [];
    const TUBE_SEGS = 180, TUBE_RADIAL = 6;

    function fiberPoints(eye, half, level, jitter) {
      const dy = level === 'sup' ? 0.09 : -0.09;
      const dest = half === 'T' ? eye : -eye;             // las nasales cruzan
      const lat = half === 'T' ? eye : -eye;              // lado de la retina
      const j = jitter * 0.04;
      const pts = [
        [eye * 1.2 + lat * 0.3, dy, 3.2],                 // retina
        [eye * 1.1 + j, dy, 2.7],                         // nervio óptico
        [eye * 0.65 + j, dy - 0.2, 1.9],
        [half === 'T' ? eye * 0.32 : j, dy - 0.3, 1.2],   // quiasma
      ];
      // Rodilla de Wilbrand: las nasales inferiores se incurvan hacia el nervio óptico contralateral.
      if (half === 'N' && level === 'inf') pts.push([dest * 0.5 + j, dy - 0.28, 1.65]);
      pts.push(
        [dest * 0.45 + j, dy - 0.3, 0.8],                 // tracto
        [dest * 0.8 + j, dy - 0.3, 0.2],
        [dest * 0.95, dy - 0.25, -0.3],                   // cuerpo geniculado lateral
      );
      if (level === 'inf') {                              // asa de Meyer (lóbulo temporal)
        pts.push([dest * 1.3 + j, -0.75, 0.3], [dest * 1.35, -0.55, -0.8], [dest * 1.1 + j, -0.3, -2.0]);
      } else {                                            // radiación parietal
        pts.push([dest * 1.1 + j, 0.45, -0.9], [dest * 1.0, 0.45, -1.9]);
      }
      pts.push([dest * 0.6 + j, dy, -2.9], [dest * 0.32, dy, -3.3]); // corteza
      return pts.map(p => new THREE.Vector3(...p));
    }

    for (const ojo of ['L', 'R'])
      for (const half of ['T', 'N'])
        for (const level of ['sup', 'inf'])
          for (const jitter of [-1, 0, 1]) {
            const curve = new THREE.CatmullRomCurve3(fiberPoints(OJO[ojo], half, level, jitter));
            const geo = new THREE.TubeGeometry(curve, TUBE_SEGS, 0.034, TUBE_RADIAL);
            geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(geo.attributes.position.count * 3), 3));
            // Las fibras se dibujan después de la cabeza y los hemisferios semitransparentes
            // (renderOrder alto): si no, esos velos quedan encima y les lavan el color.
            const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
              vertexColors: true, roughness: 0.35, emissive: 0x1a1a1a, transparent: true, opacity: 1
            }));
            mesh.renderOrder = 2;
            scene.add(mesh);
            fibers.push({ haz: `${ojo}-${half}`, half, level, jitter, curve, mesh, samples: curve.getSpacedPoints(TUBE_SEGS), tCorte: Infinity });
          }

    // Pinta la fibra con su color hasta tCorte y en gris desde ahí (la señal no pasa del corte).
    function pintarFibra(f, tCorte) {
      const col = f.mesh.geometry.attributes.color;
      const perSeg = TUBE_RADIAL + 1;
      for (let i = 0; i < col.count; i++) {
        const t = Math.floor(i / perSeg) / TUBE_SEGS;
        const c = t >= tCorte ? COLOR_MUERTA : COLOR[f.half];
        col.setXYZ(i, c.r, c.g, c.b);
      }
      col.needsUpdate = true;
    }

    // ---------- Lesiones ----------
    // Posición 3D de cada lesión del simulador 2D (mismos números). Qué fibras corta lo decide
    // el modelo 2D (`cortes`); aquí solo se ubica el corte sobre la fibra más cercana.
    const LESIONES_3D = {
      1: { pos: [0.9, -0.1, 2.3], r: 0.32 },     // nervio óptico izquierdo
      2: { pos: [-0.9, -0.1, 2.3], r: 0.32 },    // nervio óptico derecho
      3: { pos: [0.5, -0.3, 1.6], r: 0.26 },     // unión nervio–quiasma izquierda
      4: { pos: [0, -0.3, 1.2], r: 0.16 },       // quiasma central
      5: { pos: [-0.5, -0.3, 1.2], r: 0.18 },    // compresión perisquiasmática derecha
      6: { pos: [0.62, -0.3, 0.5], r: 0.28 },    // tracto óptico izquierdo
      7: { pos: [1.3, -0.72, 0.3], r: 0.28 },    // asa de Meyer izquierda
      8: { pos: [1.05, 0.45, -1.4], r: 0.28 },   // radiación parietal izquierda
      9: { pos: [0.4, 0, -3.1], r: 0.38 },       // corteza occipital izquierda
    };

    const lesionMeshes = [], labels = {}, zonas = {};
    for (const [id, l] of Object.entries(LESIONES_3D)) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 12),
        new THREE.MeshStandardMaterial({ color: 0xe11d48, emissive: 0x551010 }));
      m.position.set(...l.pos);
      m.userData.id = Number(id);
      scene.add(m);
      lesionMeshes.push(m);

      const div = document.createElement('div');
      div.className = 'label3d';
      div.textContent = id;
      div.title = `Lesión ${id}`;
      div.addEventListener('click', () => alPadre({ type: 'via-optica:elegir', id: Number(id) }));
      const label = new CSS2DObject(div);
      label.position.set(0, 0.25, 0);
      m.add(label);
      labels[id] = div;

      const zona = new THREE.Mesh(new THREE.SphereGeometry(l.r, 24, 16),
        new THREE.MeshBasicMaterial({ color: 0xe11d48, transparent: true, opacity: 0.2, depthWrite: false }));
      zona.position.copy(m.position);
      zona.visible = false;
      scene.add(zona);
      zonas[id] = zona;
    }

    // ---------- Pantalla con la escena (delante de la cara) ----------
    // Cilindro centrado entre los ojos: el ángulo horizontal (azimut) de cada punto de la escena
    // corresponde a su excentricidad en el campo visual, así los rayos de cada ojo caen donde deben.
    const PANTALLA_R = 5.5;
    const CENTRO = new THREE.Vector3(0, 0, 3.5);
    const azDeX = sx => (B.fx - sx) / PX_POR_GRADO * DEG;   // + = izquierda del paciente
    const elDeY = sy => (B.fy - sy) / PX_POR_GRADO * DEG;   // + = arriba

    const percepcion = document.getElementById('percepcion');
    const texCanvas = document.createElement('canvas');
    texCanvas.width = percepcion.width; texCanvas.height = percepcion.height;
    const textura = new THREE.CanvasTexture(texCanvas);
    textura.colorSpace = THREE.SRGBColorSpace;
    let pantalla = null;

    function construirPantalla() {
      if (pantalla) { scene.remove(pantalla); pantalla.geometry.dispose(); }
      const azIzq = azDeX(ESCENA.x0), azDer = azDeX(ESCENA.x0 + ESCENA.w);
      const yTop = elDeY(ESCENA.y0) * PANTALLA_R, yBot = elDeY(ESCENA.y0 + ESCENA.h) * PANTALLA_R;
      // En CylinderGeometry, theta = 0 apunta a +z y crece hacia +x (izquierda del paciente).
      const geo = new THREE.CylinderGeometry(PANTALLA_R, PANTALLA_R, yTop - yBot, 96, 1, true, azDer, azIzq - azDer);
      // Solo la cara interna: desde el paciente se ve la escena; desde afuera la pantalla no tapa la cabeza.
      pantalla = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: textura, side: THREE.BackSide }));
      pantalla.position.copy(CENTRO).add(new THREE.Vector3(0, (yTop + yBot) / 2, 0));
      scene.add(pantalla);
    }

    // Punto de la pantalla que corresponde a un punto (sx, sy) de la escena 2D.
    function puntoPantalla(sx, sy, k = 1) {
      const az = azDeX(sx), r = PANTALLA_R * k;
      return new THREE.Vector3(CENTRO.x + r * Math.sin(az), elDeY(sy) * PANTALLA_R, CENTRO.z + r * Math.cos(az));
    }

    // ---------- Conos de visión ----------
    // Cada ojo mira su campo (la elipse del esquema binocular 2D) a través de un cono: rayos finos
    // desde el ojo hasta el borde y el interior del campo, con la superficie apenas sombreada.
    // Todo se agrupa por cuadrante de campo para poder apagar el que se pierde.
    const grupoRayos = new THREE.Group();
    scene.add(grupoRayos);
    let conos = [];                     // { ojo, quad, retina, superficie, rayos, fotones, desde, fase }
    const reducirMovimiento = matchMedia('(prefers-reduced-motion: reduce)').matches;

    function construirConos() {
      grupoRayos.clear();
      conos = [];
      const PASOS = 72;
      for (const ojo of ['L', 'R']) {
        const eye = OJO[ojo], origin = EYE_POS(eye);
        const cx = ojo === 'L' ? B.fx - B.dx : B.fx + B.dx;
        const puntoCampo = (phi, k = 1) => [cx + B.rx * k * Math.cos(phi), B.fy + B.ry * k * Math.sin(phi)];
        const quadDe = (sx, sy) => (sy < B.fy ? 'S' : 'I') + ((ojo === 'L' ? sx < B.fx : sx > B.fx) ? 'T' : 'N');

        const porQuad = {};
        for (const q of ['ST', 'SN', 'IT', 'IN']) porQuad[q] = { tris: [], rayos: [] };

        // Superficie lateral del cono: triángulos ojo → borde del campo.
        for (let i = 0; i < PASOS; i++) {
          const p0 = puntoCampo(i / PASOS * 2 * Math.PI), p1 = puntoCampo((i + 1) / PASOS * 2 * Math.PI);
          const q = quadDe((p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2);
          porQuad[q].tris.push(origin, puntoPantalla(...p0, 0.995), puntoPantalla(...p1, 0.995));
        }
        // Rayos: al borde cada 15° y a un anillo interior cada 30°.
        for (const [k, paso] of [[1, 15], [0.55, 30]])
          for (let g = paso / 2; g < 360; g += paso) {
            const [sx, sy] = puntoCampo(g * DEG, k);
            porQuad[quadDe(sx, sy)].rayos.push(puntoPantalla(sx, sy, 0.995));
          }

        for (const [quad, { tris, rayos }] of Object.entries(porQuad)) {
          const retina = quad[1] === 'T' ? 'N' : 'T';   // el campo temporal cae en la retina nasal
          const superficie = new THREE.Mesh(new THREE.BufferGeometry().setFromPoints(tris),
            new THREE.MeshBasicMaterial({ color: COLOR[retina], transparent: true, opacity: 0.07, side: THREE.DoubleSide, depthWrite: false }));
          const lineas = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(rayos.flatMap(p => [origin, p])),
            new THREE.LineBasicMaterial({ color: COLOR[retina], transparent: true, opacity: 0.35, depthWrite: false }));
          // Fotones: viajan de la escena al ojo por cada rayo.
          const fotones = new THREE.Points(new THREE.BufferGeometry().setFromPoints(rayos),
            new THREE.PointsMaterial({ color: 0xffffff, size: 0.09, transparent: true, opacity: 0.9, depthWrite: false }));
          grupoRayos.add(superficie, lineas, fotones);
          conos.push({ ojo, quad, retina, superficie, lineas, fotones, origin, desde: rayos, fase: rayos.map(() => Math.random()) });
        }

        // Contorno del campo de este ojo dibujado sobre la pantalla.
        const contorno = [];
        for (let i = 0; i <= PASOS; i++) contorno.push(puntoPantalla(...puntoCampo(i / PASOS * 2 * Math.PI), 0.99));
        grupoRayos.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(contorno),
          new THREE.LineBasicMaterial({ color: ojo === 'L' ? 0x4f9be0 : 0xf0a060 })));
      }

      // Meridianos vertical y horizontal: separan los cuadrantes sobre la pantalla.
      const meridiano = pts => grupoRayos.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 })));
      const vert = [], hor = [];
      for (let i = 0; i <= 40; i++) {
        vert.push(puntoPantalla(B.fx, B.fy - B.ry + i / 40 * 2 * B.ry, 0.99));
        hor.push(puntoPantalla(B.fx - B.dx - B.rx + i / 40 * 2 * (B.rx + B.dx), B.fy, 0.99));
      }
      meridiano(vert); meridiano(hor);
    }

    function animarFotones(ahora) {
      const PERIODO = 1.8;
      for (const c of conos) {
        const pos = c.fotones.geometry.attributes.position;
        c.desde.forEach((p, i) => {
          const k = ((ahora / 1000) / PERIODO + c.fase[i]) % 1;
          pos.setXYZ(i, p.x + (c.origin.x - p.x) * k, p.y + (c.origin.y - p.y) * k, p.z + (c.origin.z - p.z) * k);
        });
        pos.needsUpdate = true;
      }
    }

    // Pulso de señal por fibra: recorre la vía desde la retina y se apaga en el corte.
    const pulsos = fibers.filter(f => f.jitter === 0).map((f, i) => {
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.055, 12, 8),
        new THREE.MeshBasicMaterial({ color: COLOR[f.half].clone().lerp(new THREE.Color(0xffffff), 0.55) }));
      m.visible = !reducirMovimiento;
      scene.add(m);
      return { f, m, fase: i * 0.13 };
    });

    function animarPulsos(ahora) {
      const PERIODO = 2.6;
      for (const p of pulsos) {
        const t = (((ahora / 1000) / PERIODO + p.fase) % 1) * 1.2;   // 20% de pausa entre pulsos
        const fin = Math.min(1, p.f.tCorte);
        p.m.visible = t <= fin;
        if (p.m.visible) p.m.position.copy(p.f.curve.getPointAt(t));
      }
    }

    // ---------- Percepción: escena + zonas ciegas ----------
    // Misma regla que el campo binocular 2D: un punto es ciego si ningún ojo que lo cubre lo ve.
    let imgEscena = null;
    const mascara = document.createElement('canvas');
    mascara.width = ESCENA.w; mascara.height = ESCENA.h;

    function componerPercepcion(campo, macular) {
      const mctx = mascara.getContext('2d');
      const img = mctx.createImageData(ESCENA.w, ESCENA.h);
      for (let py = 0; py < ESCENA.h; py++) {
        const sy = ESCENA.y0 + py + 0.5, v = sy < B.fy ? 'S' : 'I';
        for (let px = 0; px < ESCENA.w; px++) {
          const sx = ESCENA.x0 + px + 0.5;
          const enL = ((sx - (B.fx - B.dx)) / B.rx) ** 2 + ((sy - B.fy) / B.ry) ** 2 <= 1;
          const enR = ((sx - (B.fx + B.dx)) / B.rx) ** 2 + ((sy - B.fy) / B.ry) ** 2 <= 1;
          const qL = v + (sx < B.fx ? 'T' : 'N');   // OI: su lado temporal es la izquierda
          const qR = v + (sx > B.fx ? 'T' : 'N');
          const ve = (enL && !campo.L.has(qL)) || (enR && !campo.R.has(qR))
            || (macular && (sx - B.fx) ** 2 + (sy - B.fy) ** 2 < 20 ** 2);
          const i = (py * ESCENA.w + px) * 4;
          if (!enL && !enR) { img.data.set([27, 35, 49, 255], i); }        // fuera del campo
          else if (!ve) { img.data.set([11, 16, 22, 242], i); }            // ciego
        }
      }
      mctx.putImageData(img, 0, 0);

      const ctx = percepcion.getContext('2d');
      const W = percepcion.width, H = percepcion.height;
      ctx.save();
      ctx.clearRect(0, 0, W, H);
      if (imgEscena) ctx.drawImage(imgEscena, 0, 0, W, H);
      else { ctx.fillStyle = '#cfe6f5'; ctx.fillRect(0, 0, W, H); }
      ctx.filter = 'blur(6px)';
      ctx.drawImage(mascara, 0, 0, W, H);
      ctx.restore();
      // Cruz de fijación
      const fx = (B.fx - ESCENA.x0) / ESCENA.w * W, fy = (B.fy - ESCENA.y0) / ESCENA.h * H;
      ctx.strokeStyle = 'rgba(22,163,74,.9)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(fx - 12, fy); ctx.lineTo(fx + 12, fy); ctx.moveTo(fx, fy - 12); ctx.lineTo(fx, fy + 12); ctx.stroke();

      // La textura va espejada: sobre el cilindro, u = 0 cae a la derecha del paciente.
      const tctx = texCanvas.getContext('2d');
      tctx.save();
      tctx.setTransform(-1, 0, 0, 1, W, 0);
      tctx.drawImage(percepcion, 0, 0);
      tctx.restore();
      textura.needsUpdate = true;
    }

    // ---------- Estado (llega desde el simulador 2D) ----------
    let estado = { lesion: null, campo: { L: [], R: [] }, macular: false, examen: false, ocultar: false };

    function aplicarEstado() {
      const campo = { L: new Set(estado.campo.L), R: new Set(estado.campo.R) };
      const les = estado.ocultar ? null : estado.lesion;
      const l3d = les && LESIONES_3D[les.id];

      for (const f of fibers) {
        const corte = les?.cortes.find(c => c.h === f.haz && (!c.mitad || c.mitad === f.level));
        let t = Infinity;
        if (corte && l3d) {
          const p = new THREE.Vector3(...l3d.pos);
          let best = Infinity;
          f.samples.forEach((s, i) => { const d = s.distanceToSquared(p); if (d < best) { best = d; t = i / TUBE_SEGS; } });
        } else if (corte) t = 0;
        f.tCorte = t;
        pintarFibra(f, t);
      }
      for (const id in zonas) {
        zonas[id].visible = !!les && les.id === Number(id);
        labels[id].classList.toggle('activo', !!les && les.id === Number(id));
      }
      for (const c of conos) {
        const perdido = campo[c.ojo].has(c.quad);
        const color = perdido ? COLOR_MUERTA : COLOR[c.retina];
        c.superficie.material.color.copy(color);
        c.superficie.material.opacity = perdido ? 0.03 : 0.07;
        c.lineas.material.color.copy(color);
        c.lineas.material.opacity = perdido ? 0.12 : 0.35;
        c.fotones.material.color.set(perdido ? 0x55607a : 0xffffff);
        c.fotones.material.opacity = perdido ? 0.35 : 0.9;
      }

      const kicker = document.getElementById('lesion-kicker');
      const nombre = document.getElementById('lesion-nombre');
      const zona = document.getElementById('lesion-zona');
      const examen = document.getElementById('examen');
      const examenTexto = document.getElementById('examen-texto');
      examen.hidden = !estado.examen;
      document.getElementById('btn-siguiente').hidden = !estado.feedback;
      if (estado.examen) {
        examenTexto.textContent = estado.feedback || estado.vineta || '';
        examenTexto.className = !estado.feedback ? '' : estado.feedback.startsWith('Correcto') ? 'ok' : 'mal';
      }

      if (estado.ocultar) {
        kicker.textContent = 'Caso clínico';
        nombre.textContent = '¿Dónde está la lesión?';
        zona.textContent = 'Mirá qué pierde el paciente y hacé clic en el número que lo explica.';
      } else if (les) {
        kicker.textContent = 'Defecto campimétrico';
        nombre.textContent = les.defecto;
        zona.textContent = `${les.id}. ${les.zona}`;
      } else {
        kicker.textContent = 'Defecto campimétrico';
        nombre.textContent = 'Visión normal';
        zona.textContent = 'Sin lesión: las cuatro vías conducen.';
      }
      componerPercepcion(campo, estado.macular && !estado.ocultar);
    }

    function cargarEscena(svg) {
      const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
      const img = new Image();
      img.onload = () => { imgEscena = img; URL.revokeObjectURL(url); aplicarEstado(); };
      img.src = url;
    }

    const embebido = window.parent !== window;
    const alPadre = msg => { if (embebido) window.parent.postMessage(msg, '*'); };

    addEventListener('message', e => {
      if (e.source !== window.parent || !e.data || typeof e.data !== 'object') return;
      if (e.data.type === 'via-optica:escena') {
        if (e.data.B) { B = e.data.B; construirPantalla(); construirConos(); aplicarEstado(); }
        cargarEscena(e.data.svg);
      } else if (e.data.type === 'via-optica:estado') {
        estado = e.data;
        aplicarEstado();
      }
    });

    // ---------- Cámara ----------
    const VISTAS = {
      general: { pos: new THREE.Vector3(-10, 8, -11), target: new THREE.Vector3(0, 0, 1.5), fov: 45 },
      paciente: { pos: new THREE.Vector3(0, 0.15, 3.3), target: new THREE.Vector3(0, 0.15, 9), fov: 100 },
    };
    let transicion = null;

    function irA(nombre) {
      const v = VISTAS[nombre];
      transicion = {
        t0: performance.now(), dur: 700,
        pos0: camera.position.clone(), tgt0: controls.target.clone(), fov0: camera.fov, v
      };
      controls.enabled = nombre === 'general';
      grupoRayos.visible = nombre === 'general';
      document.body.classList.toggle('vista-paciente', nombre === 'paciente');
      document.getElementById('btn-general').setAttribute('aria-pressed', String(nombre === 'general'));
      document.getElementById('btn-paciente').setAttribute('aria-pressed', String(nombre === 'paciente'));
    }
    document.getElementById('btn-general').addEventListener('click', () => irA('general'));
    // Reiniciar: vuelve a la vista general y, fuera del examen, quita la lesión (visión normal).
    document.getElementById('btn-reiniciar').addEventListener('click', () => {
      irA('general');
      if (!estado.examen) alPadre({ type: 'via-optica:elegir', id: null });
    });
    document.getElementById('btn-siguiente').addEventListener('click', () => alPadre({ type: 'via-optica:siguiente' }));
    document.getElementById('btn-paciente').addEventListener('click', () => irA('paciente'));

    camera.position.copy(VISTAS.general.pos);
    controls.target.copy(VISTAS.general.target);

    // ---------- Interacción ----------
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let downAt = null;
    renderer.domElement.addEventListener('pointerdown', e => (downAt = [e.clientX, e.clientY]));
    renderer.domElement.addEventListener('pointerup', e => {
      if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return; // fue un arrastre
      if (document.body.classList.contains('vista-paciente')) return;
      pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObjects(lesionMeshes)[0];
      if (hit) alPadre({ type: 'via-optica:elegir', id: hit.object.userData.id });
    });

    // Los atajos del simulador (1–9, 0, Esc) siguen funcionando con el foco dentro del 3D.
    addEventListener('keydown', e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key >= '1' && e.key <= '9') alPadre({ type: 'via-optica:elegir', id: Number(e.key) });
      else if (e.key === '0') alPadre({ type: 'via-optica:elegir', id: null });
      else if (e.key === 'Escape') alPadre({ type: 'via-optica:cerrar' });
    });

    if (!embebido) document.getElementById('hint').textContent = 'Abrí esta vista desde el simulador de vía óptica para elegir lesiones.';

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      labelRenderer.setSize(innerWidth, innerHeight);
    });

    construirPantalla();
    construirConos();
    aplicarEstado();
    alPadre({ type: 'via-optica:listo' });

    renderer.setAnimationLoop(now => {
      if (transicion) {
        const { t0, dur, pos0, tgt0, fov0, v } = transicion;
        const k = Math.min(1, (now - t0) / dur), s = k * k * (3 - 2 * k);
        camera.position.lerpVectors(pos0, v.pos, s);
        controls.target.lerpVectors(tgt0, v.target, s);
        camera.fov = fov0 + (v.fov - fov0) * s;
        camera.updateProjectionMatrix();
        if (k === 1) transicion = null;
      }
      if (!reducirMovimiento) { animarFotones(now); animarPulsos(now); }
      if (controls.enabled) controls.update();
      else camera.lookAt(controls.target);
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    });
  </script>
</body>
</html>
